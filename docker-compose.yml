# MikroLLM + vLLM с Qwen3.6 на одной Tesla V100S-PCIE-32GB (Volta, sm_70).
#
# Хост: Linux + драйвер NVIDIA + nvidia-container-toolkit. Образ vLLM — linux/amd64.
# GPU у vLLM задан явно: driver nvidia, capabilities [gpu],
# NVIDIA_VISIBLE_DEVICES=all, NVIDIA_DRIVER_CAPABILITIES=compute,utility.
#
# V100 — compute capability 7.0. У неё нет BF16 и FP8.
# Официальный vllm/vllm-openai:latest собран без sm_70 и на этой карте не стартует.
# Образ по умолчанию — v0.18.0: в его Dockerfile arch list ещё включает 7.0.
# Чекпоинт — GPTQ Int4 (~16–20 ГБ). FP8-веса и --kv-cache-dtype fp8 на V100
# не считаются. Считаем в float16, без prefix cache и chunked prefill
# (на Volta vLLM их не включает) и с --enforce-eager: CUDA graph у Gated
# DeltaNet на sm_70 часто падает на старте.
# Контекст 16384. Родные 262144 на 32 ГБ не влезают.
# Картинки выключены (--language-model-only): vision tower не оставляет KV.
#
# Шлюз берётся с Docker Hub (linux/amd64 и linux/arm64). Тег = релиз, сейчас v0.0.13.
#   cp .env.example .env          # задайте ADMIN_PASSWORD
#   docker compose up -d
#
# Админка: http://127.0.0.1:4000/admin
# Статус → добавить сервер: тип vLLM, URL http://vllm:8000.
# Модели → «в шлюз». Имя в каталоге vLLM: qwen3.6
#   (чекпоинт btbtyler09/Qwen3.6-27B-GPTQ-4bit, --served-model-name).
#
# Первый старт качает веса в том hf-cache.
# У официального Qwen нет GPTQ Int4 для 3.6; этот чекпоинт — GPTQ той же
# Qwen/Qwen3.6-27B, архитектура qwen3_5, его грузит vLLM 0.18.
#
# Выключить thinking на стороне сервера:
#   --default-chat-template-kwargs {"enable_thinking": false}

name: mikrollm

services:
  mikrollm:
    image: ${MIKROLLM_IMAGE:-javded/mikrollm:v0.0.13}
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - mikrollm-data:/data
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      MIKROLLM_LISTEN: ":4000"
      MIKROLLM_DATA: "/data"
      # пустой seed в этом бинаре подставляет LAN-хосты Ollama mac-80/mac-82
      MIKROLLM_SEED: none
    depends_on:
      - vllm

  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.18.0}
    restart: unless-stopped
    ipc: host
    gpus:
      - driver: nvidia
        count: all
        capabilities: [gpu]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # V100 часто живёт со старым драйвером; образ собран на CUDA 12.9.
      VLLM_ENABLE_CUDA_COMPATIBILITY: "1"
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command:
      - ${VLLM_MODEL:-btbtyler09/Qwen3.6-27B-GPTQ-4bit}
      - --served-model-name
      - qwen3.6
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --trust-remote-code
      - --dtype
      - float16
      - --quantization
      - gptq
      - --tensor-parallel-size
      - ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-16384}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS:-4}
      - --enforce-eager
      - --language-model-only
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 1800s

volumes:
  mikrollm-data:
  hf-cache:
