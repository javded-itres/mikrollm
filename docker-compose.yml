# MikroLLM + vLLM с Qwen3.6 (FP8 MoE, одна NVIDIA GPU).
#
# Хост: Linux + драйвер NVIDIA + nvidia-container-toolkit. Образ vLLM — linux/amd64.
# Qwen3.6 требует vLLM >= 0.17 (тег latest). На Blackwell (SM100/SM120) замените
# образ на vllm/vllm-openai:cu130-nightly.
#
# Шлюз берётся с Docker Hub (linux/amd64 и linux/arm64). Тег = релиз, сейчас v0.0.13.
#   cp .env.example .env          # задайте ADMIN_PASSWORD
#   docker compose up -d
#
# Админка: http://127.0.0.1:4000/admin
# Статус → добавить сервер: тип vLLM, URL http://vllm:8000.
# Модели → «в шлюз». Имя в каталоге vLLM: qwen3.6
#   (чекпоинт Qwen/Qwen3.6-35B-A3B-FP8, --served-model-name).
#
# Веса ~18 ГБ, первый старт качает их в том hf-cache. Родной контекст модели —
# 262144 токена и просит ~80 ГБ. Ниже по умолчанию 32768, чтобы чекпоинт
# поднялся на одной карте 24–48 ГБ. Полное окно: VLLM_MAX_MODEL_LEN=262144
# и карта с запасом под KV.
#
# Другие чекпоинты (поменяйте VLLM_MODEL, имя qwen3.6 не трогайте):
#   Qwen/Qwen3.6-35B-A3B          BF16, 2×H100 / 1×H200
#   Qwen/Qwen3.6-27B-FP8          плотная 27B, от ~40 ГБ
#   Qwen/Qwen3.6-27B-GPTQ-Int4    плотная 27B, одна карта 24 ГБ
#
# Если в логе vLLM cuda graph больше mamba-кэша — добавьте в command
# --max-cudagraph-capture-size 64.
# Только текст (больше места под KV, без картинок): --language-model-only
# вместо --mm-encoder-tp-mode / --mm-processor-cache-type.
# Низкая задержка, один клиент: --speculative-config {"method":"mtp","num_speculative_tokens":2}
# Выключить thinking на стороне сервера:
#   --default-chat-template-kwargs {"enable_thinking": false}

name: mikrollm

services:
  mikrollm:
    image: ${MIKROLLM_IMAGE:-javded/mikrollm:v0.0.13}
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - mikrollm-data:/data
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      MIKROLLM_LISTEN: ":4000"
      MIKROLLM_DATA: "/data"
      # пустой seed в этом бинаре подставляет LAN-хосты Ollama mac-80/mac-82
      MIKROLLM_SEED: none
    depends_on:
      - vllm

  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    restart: unless-stopped
    ipc: host
    gpus: all
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command:
      - ${VLLM_MODEL:-Qwen/Qwen3.6-35B-A3B-FP8}
      - --served-model-name
      - qwen3.6
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --trust-remote-code
      - --tensor-parallel-size
      - ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-32768}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS:-8}
      - --kv-cache-dtype
      - fp8
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --mm-encoder-tp-mode
      - data
      - --mm-processor-cache-type
      - shm
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 1800s

volumes:
  mikrollm-data:
  hf-cache:
