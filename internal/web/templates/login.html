<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MikroLLM — вход</title>
  <meta name="theme-color" content="#0e1218">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MikroLLM">
  <link rel="icon" href="/admin/static/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/admin/static/apple-touch-icon.png">
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <link rel="stylesheet" href="/admin/static/app.css?v=36">
</head>
<body>
  <form class="card login" method="post" action="/admin/login">
    <img class="login-logo" src="/admin/static/logo.svg" width="120" height="120" alt="MikroLLM">
    <p class="muted">Админка LLM-прокси</p>
    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
    <label>Пароль</label>
    <input type="password" name="password" autofocus required autocomplete="current-password">
    <p><button type="submit">Войти</button></p>
  </form>
  <script src="/admin/static/pwa.js"></script>
</body>
</html>
