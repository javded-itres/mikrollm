name: Docker Hub

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, for example v0.0.13. Builds the branch you run from."
        required: true
        type: string

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: javded
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          case "$tag" in
            ""|*[!A-Za-z0-9_.-]*)
              echo "invalid docker tag: $tag" >&2
              exit 1
              ;;
          esac
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dockerhub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: javded/mikrollm:${{ steps.tag.outputs.name }}
          build-args: VERSION=${{ steps.tag.outputs.name }}
